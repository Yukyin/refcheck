<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RefCheck</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1d1f24; --muted:#6b6f78; --line:#e3e0d8;
    --accent:#2f4bd8; --accent-soft:#e8ecff;
    --pass:#1f8a4c; --pass-bg:#e4f4ea;
    --mis:#c8372d; --mis-bg:#fbe7e5;
    --doubt:#b7791f; --doubt-bg:#fbf0dc;
    --nf:#6b4fbb; --nf-bg:#eee8fb;
    --err:#6b6f78; --err-bg:#eceef1;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:40px 24px 80px}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:40px;letter-spacing:-.5px;margin:0}
  h1 span{color:var(--accent)}
  .tagline{color:var(--muted);margin:6px 0 0;max-width:640px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:26px}
  .drop{border:2px dashed #c9c5ba;border-radius:12px;padding:30px;text-align:center;cursor:pointer;transition:.15s}
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
  .drop strong{display:block;font-size:16px}
  .drop .fname{color:var(--accent);margin-top:6px;font-size:14px}
  details{margin-top:14px}
  summary{cursor:pointer;color:var(--muted);font-size:14px}
  textarea{width:100%;min-height:140px;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:12px;
    font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
  .opts label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
  .opts input{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;font-size:14px;color:var(--ink)}
  @media (max-width:760px){.opts{grid-template-columns:1fr}}
  .row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:18px}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 22px;font:inherit;font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:8px 16px;font-weight:500}
  .privacy{color:var(--muted);font-size:13px;margin-left:auto}
  .progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:18px;display:none}
  .progress div{height:100%;width:0;background:var(--accent);transition:width .2s}
  .ptext{font-size:13px;color:var(--muted);margin-top:6px;display:none}
  .legend{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:26px}
  .chip{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;transition:.15s}
  .chip:hover{border-color:#bdb8ab}
  .chip.on{outline:2px solid var(--ink)}
  .chip .n{font-size:26px;font-weight:700;font-family:Georgia,serif}
  .chip .d{font-size:12.5px;color:var(--muted);margin-top:2px}
  .toolbar{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  table{width:100%;border-collapse:separate;border-spacing:0;margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);background:#faf9f6;padding:10px 14px;border-bottom:1px solid var(--line)}
  td{padding:14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
  tr:last-child td{border-bottom:0}
  .key{font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
  .t{font-weight:600;margin:2px 0}
  .meta{color:var(--muted);font-size:13px}
  .bad{color:var(--mis);font-weight:600}
  .badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
  .s-pass{color:var(--pass);background:var(--pass-bg)}
  .s-mismatch{color:var(--mis);background:var(--mis-bg)}
  .s-doubt{color:var(--doubt);background:var(--doubt-bg)}
  .s-notfound{color:var(--nf);background:var(--nf-bg)}
  .s-error,.s-pending{color:var(--err);background:var(--err-bg)}
  .src{font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--accent);text-transform:uppercase}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .notes div{margin-bottom:4px}
  .scholar{font-size:12.5px;white-space:nowrap}
  .empty{color:var(--muted);text-align:center;padding:30px}
  @media (max-width:1000px){.legend{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:760px){
    .legend{grid-template-columns:repeat(2,1fr)}
    th:nth-child(3),td:nth-child(3){display:none}
    h1{font-size:32px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Ref<span>Check</span></h1>
      <p class="tagline" data-i18n="tagline"></p>
    </div>
  </header>

  <section class="panel">
    <div class="drop" id="drop">
      <strong data-i18n="drop"></strong>
      <div class="fname" id="fname"></div>
      <input type="file" id="file" accept=".bib,.bibtex,.txt" hidden>
    </div>
    <details id="optBox">
      <summary data-i18n="options"></summary>
      <div class="opts">
        <label><span data-i18n="mailto"></span><input id="mailto" type="email" placeholder="you@university.edu" autocomplete="email"></label>
        <label><span data-i18n="oakey"></span><input id="oakey" type="text" placeholder="OpenAlex API key" autocomplete="off"></label>
      </div>
    </details>
    <div class="row">
      <button class="btn" id="start" data-i18n="start"></button>
      <span class="privacy" data-i18n="privacy"></span>
    </div>
    <div class="progress" id="progress"><div></div></div>
    <div class="ptext" id="ptext"></div>
  </section>

  <section id="results" hidden>
    <div class="legend" id="legend"></div>
    <div class="toolbar">
      <button class="btn ghost" id="retry" data-i18n="retry"></button>
      <button class="btn ghost" id="export" data-i18n="export"></button>
    </div>
    <table>
      <thead><tr>
        <th style="width:30%" data-i18n="colEntry"></th>
        <th style="width:11%" data-i18n="colStatus"></th>
        <th style="width:32%" data-i18n="colMatch"></th>
        <th data-i18n="colNotes"></th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>
</div>

<script id="core">
/* ---------- Core logic: parsing, matching, judging (no DOM) ---------- */
const RC = (() => {
  const ACCENT = /\\(["'`^~=.uvHcdbrtk])\s*\{?\s*\\?([a-zA-Z])\s*\}?/g;
  function cleanLatex(s) {
    if (!s) return "";
    return s
      .replace(ACCENT, "$2")
      .replace(/\\(ss)\b/g, "ss").replace(/\\([oOlL]|ae|AE|oe|OE|aa|AA)\b/g, "$1")
      .replace(/\\[&%$#_]/g, m => m[1])
      .replace(/\\[a-zA-Z]+\*?\s*/g, " ")
      .replace(/<[^>]+>/g, " ")
      .replace(/[{}]/g, "")
      .replace(/~/g, " ")
      .replace(/-{2,3}/g, "-")
      .replace(/\s+/g, " ")
      .trim();
  }
  function norm(s) {
    return cleanLatex(s).normalize("NFKD").replace(/[̀-ͯ]/g, "")
      .toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g, " ").trim();
  }
  function lev(a, b) {
    if (a === b) return 0;
    const m = a.length, n = b.length;
    if (!m) return n; if (!n) return m;
    let prev = new Array(n + 1), cur = new Array(n + 1);
    for (let j = 0; j <= n; j++) prev[j] = j;
    for (let i = 1; i <= m; i++) {
      cur[0] = i;
      const ca = a.charCodeAt(i - 1);
      for (let j = 1; j <= n; j++) {
        const cost = ca === b.charCodeAt(j - 1) ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      }
      [prev, cur] = [cur, prev];
    }
    return prev[n];
  }
  function sim(a, b) {
    a = norm(a); b = norm(b);
    if (!a || !b) return 0;
    return 1 - lev(a, b) / Math.max(a.length, b.length);
  }

  /* BibTeX parser */
  function parseBib(text) {
    const out = [], strings = {};
    let i = 0;
    const N = text.length;
    function readBraced(start) { // text[start] is { or (
      const open = text[start], close = open === "{" ? "}" : ")";
      let depth = 0, j = start;
      for (; j < N; j++) {
        const c = text[j];
        if (c === "\\") { j++; continue; }
        if (c === "{" || (open === "(" && c === "(")) depth++;
        else if (c === "}" || (open === "(" && c === ")")) { depth--; if (depth === 0) break; }
      }
      return [text.slice(start + 1, j), j + 1];
    }
    function parseFields(body) {
      const f = {};
      let k = 0;
      const L = body.length;
      while (k < L) {
        const m = /\s*,?\s*([A-Za-z][\w:.\-+]*)\s*=\s*/y;
        m.lastIndex = k;
        const r = m.exec(body);
        if (!r) { k++; continue; }
        const name = r[1].toLowerCase();
        k = m.lastIndex;
        let val = "";
        while (k < L) {
          while (/\s/.test(body[k] || "")) k++;
          const c = body[k];
          if (c === "{") {
            let d = 0, j = k;
            for (; j < L; j++) {
              if (body[j] === "\\") { j++; continue; }
              if (body[j] === "{") d++;
              else if (body[j] === "}") { d--; if (d === 0) break; }
            }
            val += body.slice(k + 1, j); k = j + 1;
          } else if (c === '"') {
            let d = 0, j = k + 1;
            for (; j < L; j++) {
              if (body[j] === "\\") { j++; continue; }
              if (body[j] === "{") d++;
              else if (body[j] === "}") d--;
              else if (body[j] === '"' && d === 0) break;
            }
            val += body.slice(k + 1, j); k = j + 1;
          } else {
            const mm = /[^,#\s}]+/y; mm.lastIndex = k;
            const t = mm.exec(body);
            if (!t) break;
            const w = t[0];
            val += strings[w.toLowerCase()] !== undefined ? strings[w.toLowerCase()] : w;
            k = mm.lastIndex;
          }
          while (/\s/.test(body[k] || "")) k++;
          if (body[k] === "#") { k++; continue; }
          break;
        }
        f[name] = val.replace(/\s+/g, " ").trim();
      }
      return f;
    }
    while (i < N) {
      const at = text.indexOf("@", i);
      if (at < 0) break;
      const m = /@\s*([A-Za-z]+)\s*([{(])/y; m.lastIndex = at;
      const r = m.exec(text);
      if (!r) { i = at + 1; continue; }
      const type = r[1].toLowerCase();
      const [body, end] = readBraced(m.lastIndex - 1);
      i = end;
      if (type === "comment" || type === "preamble") continue;
      if (type === "string") { Object.assign(strings, parseFields(body)); continue; }
      const comma = body.indexOf(",");
      const key = (comma < 0 ? body : body.slice(0, comma)).trim();
      const fields = comma < 0 ? {} : parseFields(body.slice(comma + 1));
      out.push(makeEntry(type, key, fields));
    }
    return out;
  }
  function splitAuthors(s) {
    const parts = []; let d = 0, last = 0;
    const low = s;
    for (let i = 0; i < low.length; i++) {
      const c = low[i];
      if (c === "{") d++; else if (c === "}") d--;
      else if (d === 0 && /\s/.test(c) && /^\s+and\s+/i.test(low.slice(i))) {
        const m = /^\s+and\s+/i.exec(low.slice(i));
        parts.push(low.slice(last, i)); i += m[0].length - 1; last = i + 1;
      }
    }
    parts.push(low.slice(last));
    return parts.map(p => p.trim()).filter(Boolean);
  }
  function lastName(a) {
    if (!a) return "";
    if (/^others$/i.test(a.trim())) return "";
    const SUFFIX = /^(jr|sr|ii|iii|iv)$/;
    if (a.includes(",")) {
      const parts = a.split(",").map(x => x.trim());
      const first = norm(parts[0]).split(" ").filter(t => t && !SUFFIX.test(t));
      return first.join(" ");
    }
    const toks = norm(a).split(" ").filter(t => t && !SUFFIX.test(t));
    return toks.length ? toks[toks.length - 1] : "";
  }
  function firstInitial(a) {
    if (!a || /^others$/i.test(a.trim())) return "";
    let given;
    if (a.includes(",")) given = norm(a.split(",").slice(1).join(" ")).split(" ").filter(t => t && !/^(jr|sr|ii|iii|iv)$/.test(t)).join(" ");
    else { const t = norm(a).split(" ").filter(Boolean); given = t.slice(0, -1).join(" "); }
    return given ? given[0] : "";
  }
  function makeEntry(type, key, f) {
    const authors = f.author ? splitAuthors(f.author) : (f.editor ? splitAuthors(f.editor) : []);
    const ym = (f.year || f.date || "").match(/\d{4}/);
    let doi = (f.doi || "").replace(/^https?:\/\/(dx\.)?doi\.org\//i, "").trim();
    if (!doi && f.url) { const dm = f.url.match(/doi\.org\/(10\.[^\s]+)/i); if (dm) doi = dm[1]; }
    return {
      type, key, fields: f,
      title: cleanLatex(f.title || ""),
      authors: authors.map(cleanLatex),
      people: authors.map(cleanLatex).filter(a => !/^others$/i.test(a.trim())).map(a => ({ name: a, last: lastName(a), init: firstInitial(a) })).filter(p => p.last),
      hasOthers: authors.some(a => /^others$/i.test(a.trim())),
      year: ym ? ym[0] : "",
      venue: cleanLatex(f.booktitle || f.journal || f.publisher || f.howpublished || ""),
      doi,
    };
  }

  function checkAuthors(e, dbAuthors) {
    const seen = new Set();
    const db = dbAuthors.filter(a => /[a-z]/i.test(a)).filter(a => { const k = norm(a); if (seen.has(k)) return false; seen.add(k); return true; });
    if (!e.people.length || !db.length) return { ok: null, problems: [] };
    const pos = e.people.map(p => db.findIndex(a => authorMatch(p.last, a, p.init)));
    const missing = e.people.filter((p, i) => pos[i] < 0).map(p => p.name);
    const problems = [];
    if (missing.length) problems.push(["authorsMissing", missing.join("; ")]);
    else if (pos[0] !== 0 || pos.some((v, i) => i && v < pos[i - 1])) problems.push(["authorOrder", db.slice(0, 4).join(", ") + (db.length > 4 ? ", ..." : "")]);
    if (!e.hasOthers && e.people.length < db.length) problems.push(["authorCount", db.length + " authors, the entry lists " + e.people.length]);
    return { ok: !problems.length, problems };
  }
  const VENUES = [
    ["emnlp", /\bemnlp\b|empirical methods in natural language processing/], ["naacl", /\bnaacl\b|north american chapter/],
    ["eacl", /\beacl\b|european chapter of the association/], ["aacl", /\baacl\b|asia pacific chapter/],
    ["coling", /\bcoling\b|international conference on computational linguistics/],
    ["acl", /\bacl\b|annual meeting of the association for computational linguistics/],
    ["neurips", /\bneurips\b|\bnips\b|neural information processing systems/], ["iclr", /\biclr\b|international conference on learning representations/],
    ["icml", /\bicml\b|international conference on machine learning/], ["cvpr", /\bcvpr\b|computer vision and pattern recognition/],
    ["iccv", /\biccv\b|international conference on computer vision/], ["eccv", /\beccv\b|european conference on computer vision/],
    ["aaai", /\baaai\b/], ["ijcai", /\bijcai\b/], ["cikm", /\bcikm\b|information and knowledge management/],
    ["wsdm", /\bwsdm\b|web search and data mining/], ["kdd", /\bkdd\b|knowledge discovery and data mining/],
    ["sigir", /\bsigir\b|research and development in information retrieval/], ["www", /\bwww\b|the web conference|world wide web conference/],
    ["chi", /\bchi\b|human factors in computing systems/], ["colm", /\bcolm\b|conference on language modeling/],
  ];
  function venueKey(v) {
    const n = norm(v);
    if (!n || /arxiv|\bcorr\b|preprint/.test(n)) return null;
    const hit = VENUES.find(([, re]) => re.test(n));
    if (!hit) return null;
    return (/\bfindings\b/.test(n) ? "findings-" : "") + hit[0];
  }
  function authorMatch(bibLast, dbName, bibInit) {
    if (!bibLast || !dbName) return false;
    const all = norm(dbName).split(" ").filter(Boolean);
    const last = bibLast.split(" ");
    if (!last.every(t => all.includes(t))) return false;
    if (!bibInit) return true;
    const rest = all.filter(t => !last.includes(t));
    return !rest.length || rest.some(t => t[0] === bibInit);
  }

  /* Database adapters: each returns [{source,title,authors,year,venue,url}] */
  /* One request at a time per database, spaced to stay inside each database's published limits.
     Crossref public pool: list queries 1 per second, concurrency 1. */
  const CONFIG = { mailto: "", openalexKey: "" };
  const hosts = {};
  function gapFor(url) {
    if (url.includes("api.crossref.org/works?")) return CONFIG.mailto ? 400 : 1100;
    if (url.includes("api.crossref.org")) return 250;
    if (url.includes("dblp.org")) return 1100;
    if (url.includes("api.openalex.org")) return 150;
    return 0;
  }
  function withHost(url, fn) {
    const host = (url.match(/^https?:\/\/([^/]+)/) || [])[1] || "";
    const st = hosts[host] = hosts[host] || { chain: Promise.resolve(), last: 0, mult: 1 };
    const run = st.chain.then(async () => {
      const wait = st.last + gapFor(url) * st.mult - Date.now();
      if (wait > 0) await new Promise(res => setTimeout(res, wait));
      try { return await fn(st); } finally { st.last = Date.now(); }
    });
    st.chain = run.catch(() => {});
    return run;
  }
  function withParams(url) {
    if (url.includes("api.crossref.org") && CONFIG.mailto) url += (url.includes("?") ? "&" : "?") + "mailto=" + encodeURIComponent(CONFIG.mailto);
    if (url.includes("api.openalex.org") && CONFIG.openalexKey) url += (url.includes("?") ? "&" : "?") + "api_key=" + encodeURIComponent(CONFIG.openalexKey);
    return url;
  }
  async function getJSON(url, fetcher, tries = 3) {
    url = withParams(url);
    for (let a = 0; a < tries; a++) {
      try {
        return await withHost(url, async st => {
          const ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
          const timer = ctl ? setTimeout(() => ctl.abort(), 15000) : null;
          try {
            const r = await fetcher(url, ctl ? { signal: ctl.signal } : {});
            if (r.status === 404) return { notFound: true };
            if (r.status === 429 || r.status >= 500) {
              if (r.status === 429) st.mult = Math.min(st.mult * 2, 8);
              const ra = Number(r.headers && r.headers.get && r.headers.get("Retry-After"));
              const err = new Error("retry " + r.status);
              err.retry = true; err.wait = Math.min(ra > 0 ? ra * 1000 : 0, 10000);
              throw err;
            }
            if (!r.ok) throw new Error("http " + r.status);
            const j = await r.json();
            st.mult = Math.max(1, st.mult / 2);
            return j;
          } finally { if (timer) clearTimeout(timer); }
        });
      } catch (e) {
        const retryable = e.retry || e.name === "AbortError";
        if (!retryable || a === tries - 1) throw e;
        await new Promise(res => setTimeout(res, e.wait || 2000 * Math.pow(2, a)));
      }
    }
  }
  const arr = x => x == null ? [] : Array.isArray(x) ? x : [x];
  const ADAPTERS = {
    dblp: async (e, F) => {
      const j = await getJSON(`https://dblp.org/search/publ/api?q=${encodeURIComponent(norm(e.title))}&format=json&h=10`, F);
      return arr(j?.result?.hits?.hit).map(h => {
        const x = h.info || {};
        return {
          source: "DBLP", title: cleanLatex(x.title || "").replace(/\.$/, ""),
          authors: arr(x.authors?.author).map(a => (typeof a === "string" ? a : a.text || "").replace(/\s+\d{4}$/, "")),
          year: String(x.year || ""), venue: arr(x.venue).join(", "),
          url: arr(x.ee)[0] || x.url || "",
        };
      });
    },
    crossref: async (e, F) => {
      const j = await getJSON(`https://api.crossref.org/works?query.bibliographic=${encodeURIComponent(e.title)}&rows=8&select=title,author,issued,DOI,container-title,URL`, F);
      return arr(j?.message?.items).map(crossrefItem);
    },
    openalex: async (e, F) => {
      const j = await getJSON(`https://api.openalex.org/works?search=${encodeURIComponent(norm(e.title))}&per-page=8&select=id,display_name,authorships,publication_year,primary_location,doi`, F);
      return arr(j?.results).map(openalexItem);
    },
  };
  function crossrefItem(x) {
    return {
      source: "Crossref", title: cleanLatex(arr(x.title)[0] || ""),
      authors: arr(x.author).map(a => [a.given, a.family].filter(Boolean).join(" ") || a.name || ""),
      year: String(x.issued?.["date-parts"]?.[0]?.[0] || ""),
      venue: arr(x["container-title"])[0] || "",
      url: x.DOI ? "https://doi.org/" + x.DOI : (x.URL || ""),
    };
  }
  function openalexItem(x) {
    return {
      source: "OpenAlex", title: cleanLatex(x.display_name || ""),
      authors: arr(x.authorships).map(a => a.author?.display_name || ""),
      year: String(x.publication_year || ""),
      venue: x.primary_location?.source?.display_name || "",
      url: x.doi || x.id || "",
    };
  }
  async function lookupDOI(doi, F) {
    // returns {status:'found', rec} | {status:'missing'} | {status:'unknown'}
    let crossFail = false;
    if (!/^10\.48550\//i.test(doi)) {
      try {
        const j = await getJSON(`https://api.crossref.org/works/${encodeURIComponent(doi)}`, F, 2);
        if (j && !j.notFound && j.message && arr(j.message.title).length) return { status: "found", rec: crossrefItem(j.message) };
      } catch (e) { crossFail = true; }
    }
    try {
      const j = await getJSON(`https://api.openalex.org/works/${encodeURIComponent("https://doi.org/" + doi)}`, F, 2);
      if (j && !j.notFound && j.display_name) return { status: "found", rec: openalexItem(j) };
      if (j && j.notFound && !crossFail && !/^10\.48550\//i.test(doi)) return { status: "missing" };
    } catch (e) {}
    return { status: "unknown" };
  }

  const UNINDEXED = new Set(["book", "misc", "online", "techreport", "phdthesis", "mastersthesis", "manual", "unpublished", "electronic", "www", "booklet"]);

  function judge(e, cands, doiRes, failed, enabled) {
    const reasons = [];
    if (!e.title) return { status: "doubt", reasons: [["noTitle"]], match: null };
    const scored = cands.map(c => ({ ...c, s: sim(e.title, c.title) })).sort((a, b) => b.s - a.s);
    let doiProblem = null;
    if (doiRes && doiRes.status === "found") {
      const s = sim(e.title, doiRes.rec.title);
      if (s >= 0.9) scored.unshift({ ...doiRes.rec, s, viaDOI: true });
      else doiProblem = "doiOther";
    } else if (doiRes && doiRes.status === "missing") doiProblem = "doiNotFound";

    const strong = scored.filter(c => c.s >= 0.95);
    const bibVenue = venueKey(e.venue);
    for (const c of strong) {
      c.ac = checkAuthors(e, c.authors);
      c.aOK = c.ac.ok;
      c.yOK = e.year ? c.year === e.year : null;
      const dv = venueKey(c.venue);
      c.vOK = bibVenue && dv ? bibVenue === dv : null;
      c.score = [c.aOK, c.yOK, c.vOK].filter(x => x !== false).length;
    }
    if (strong.length) {
      if (!e.people.length) reasons.push(["noAuthor"]);
      if (!e.year) reasons.push(["noYear"]);
      const full = strong.find(c => c.aOK !== false && c.yOK !== false && c.vOK !== false);
      if (full) {
        if (doiProblem === "doiOther") return { status: "mismatch", reasons: [["doiOther"], ...reasons], match: full };
        if (doiProblem === "doiNotFound" || reasons.length) return { status: "doubt", reasons: doiProblem ? [[doiProblem], ...reasons] : reasons, match: full };
        return { status: "pass", reasons: [], match: full };
      }
      const best = strong.slice().sort((x, y) => y.score - x.score)[0];
      if (best.aOK === false) reasons.push(...best.ac.problems);
      if (best.yOK === false) {
        const yrs = [...new Set(strong.filter(c => c.aOK !== false).map(c => c.year).filter(Boolean))];
        reasons.push(["year", (yrs.length ? yrs : [best.year]).join(", ")]);
      }
      if (best.vOK === false) reasons.push(["venue", best.venue]);
      if (doiProblem) reasons.unshift([doiProblem]);
      return { status: "mismatch", reasons, match: best, fields: { author: best.aOK === false, year: best.yOK === false, venue: best.vOK === false } };
    }
    if (doiProblem) reasons.push([doiProblem]);
    if (scored[0] && scored[0].s >= 0.75) {
      reasons.unshift(["similar", Math.round(scored[0].s * 100)]);
      return { status: "doubt", reasons, match: scored[0] };
    }
    if (failed.length) return { status: "error", reasons: [["partialFail", failed.join(", ")], ...reasons], match: null };
    if (UNINDEXED.has(e.type)) reasons.push(["typeNotIndexed", "@" + e.type]);
    return { status: "notfound", reasons, match: null };
  }

  const LABEL = { dblp: "DBLP", crossref: "Crossref", openalex: "OpenAlex" };
  async function checkEntry(e, enabled, F, health = {}) {
    if (!e.title) return judge(e, [], null, [], enabled);
    const failedNames = [];
    const jobs = enabled.map(name => {
      const h = health[name] = health[name] || { ok: 0, fail: 0, streak: 0 };
      // stop asking a database that never answered, or that has failed several entries in a row
      if (h.ok === 0 && h.fail >= 2) { failedNames.push(name); return Promise.resolve([]); }
      return ADAPTERS[name](e, F)
        .then(x => { h.ok++; h.streak = 0; return x; })
        .catch(() => { h.fail++; h.streak++; failedNames.push(name); return []; });
    });
    const doiJob = e.doi ? lookupDOI(e.doi, F) : Promise.resolve(null);
    const [lists, doiRes] = await Promise.all([Promise.all(jobs), doiJob]);
    // a database that has never answered in this run is treated as unavailable, not as a transient failure
    const failed = failedNames.filter(n => health[n].ok > 0).map(n => LABEL[n]);
    return judge(e, lists.flat(), doiRes, failed, enabled);
  }

  return { CONFIG, parseBib, cleanLatex, norm, sim, authorMatch, checkAuthors, venueKey, judge, checkEntry, lastName };
})();
if (typeof module !== "undefined") module.exports = RC;
</script>

<script>
/* ---------- UI ---------- */
(() => {
  if (typeof document === "undefined") return;
  const T = {
    en: {
      tagline: "Upload a .bib file. Every entry is checked against DBLP, Crossref and OpenAlex, and anything that cannot be confirmed is flagged for you to verify.",
      drop: "Drop a .bib file here, or click to choose",
      options: "Better lookups (recommended)",
      mailto: "Your email, sent to Crossref for a higher rate limit",
      oakey: "OpenAlex API key, free at openalex.org",
      start: "Check references",
      privacy: "The file stays in your browser. Only titles and DOIs are sent to the databases.",
      progress: "{d} / {n} checked",
      noEntries: "No BibTeX entries found.",
      all: "All", allD: "Every entry in the file.",
      pass: "Verified", passD: "Matches a database record.",
      mismatch: "Mismatch", mismatchD: "The paper exists, but some details differ. The database record is shown.",
      doubt: "Uncertain", doubtD: "A close but not exact match, or the entry lacks a field. Please verify.",
      notfound: "Not found", notfoundD: "No matching record. Books, web pages and some workshop papers are often not indexed, so please verify manually.",
      error: "Lookup failed", errorD: "A database did not respond for this entry. Use Retry.",
      pending: "Checking",
      colEntry: "Entry in your .bib", colStatus: "Result", colMatch: "Closest database record", colNotes: "Notes",
      retry: "Retry unresolved", export: "Export CSV", scholar: "Search Google Scholar",
      noTitle: "The entry has no title.",
      noAuthor: "The entry has no authors, so authors were not checked.",
      noYear: "The entry has no year, so the year was not checked.",
      authorsMissing: "Not in the database author list: {x}.",
      authorOrder: "Author order differs. Database: {x}.",
      authorCount: "The database lists {x}.",
      venue: "Venue differs. Database: {x}.",
      year: "Year differs. Database: {x}.",
      similar: "The closest title is similar but not identical ({x}% match).",
      doiOther: "The DOI points to a different paper.",
      doiNotFound: "The DOI was not found in Crossref or OpenAlex.",
      typeNotIndexed: "Entries of type {x} are often not indexed.",
      partialFail: "Not reached: {x}.",
      viaDOI: "matched by DOI",
      down: "{x} could not be reached from this page, so results rely on the other databases.",
      none: "No record",
      emptyFilter: "Nothing here.",
    },
  };
  const lang = "en";
  const t = (k, x) => (T[lang][k] || k).replace("{x}", x ?? "");
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const ORDER = ["mismatch", "notfound", "doubt", "error", "pass"];

  let entries = [], results = [], filter = "all", fileText = "", running = false;

  function applyLang() {
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  }

  const drop = $("drop"), file = $("file");
  drop.onclick = () => file.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); };
  file.onchange = () => file.files[0] && readFile(file.files[0]);
  function readFile(f) {
    const r = new FileReader();
    r.onload = () => { fileText = r.result; $("fname").textContent = f.name; };
    r.readAsText(f);
  }

  const store = { get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  $("mailto").value = store.get("refcheck-mailto");
  $("oakey").value = store.get("refcheck-oakey");
  function readOptions() {
    RC.CONFIG.mailto = $("mailto").value.trim();
    RC.CONFIG.openalexKey = $("oakey").value.trim();
    store.set("refcheck-mailto", RC.CONFIG.mailto);
    store.set("refcheck-oakey", RC.CONFIG.openalexKey);
  }
  function enabledSources() {
    return ["dblp", "crossref", "openalex"];
  }

  async function runPool(idxs) {
    const enabled = enabledSources();
    if (!enabled.length) return;
    readOptions();
    running = true; $("start").disabled = true; $("retry").disabled = true;
    let done = 0;
    const total = idxs.length;
    const prog = $("progress"), bar = prog.firstElementChild, pt = $("ptext");
    prog.style.display = "block"; pt.style.display = "block";
    const tick = () => { bar.style.width = (100 * done / total) + "%"; pt.textContent = T[lang].progress.replace("{d}", done).replace("{n}", total); };
    tick();
    idxs.forEach(i => results[i] = { status: "pending", reasons: [], match: null });
    render();
    const health = {};
    const queue = idxs.slice();
    async function worker() {
      while (queue.length) {
        const i = queue.shift();
        try { results[i] = await RC.checkEntry(entries[i], enabled, fetch.bind(window), health); }
        catch (e) { results[i] = { status: "error", reasons: [], match: null }; }
        done++; tick(); render();
      }
    }
    await Promise.all([worker(), worker(), worker()]);
    const down = Object.keys(health).filter(n => health[n].ok === 0 && health[n].fail > 0).map(n => ({ dblp: "DBLP", crossref: "Crossref", openalex: "OpenAlex" }[n]));
    if (down.length) pt.textContent += " · " + t("down", down.join(", "));
    running = false; $("start").disabled = false; $("retry").disabled = false;
  }

  $("start").onclick = () => {
    const text = fileText;
    entries = RC.parseBib(text || "");
    if (!entries.length) { alertBox(t("noEntries")); return; }
    results = entries.map(() => ({ status: "pending", reasons: [], match: null }));
    filter = "all";
    $("results").hidden = false;
    runPool(entries.map((_, i) => i));
  };
  $("retry").onclick = () => {
    if (running) return;
    const idxs = results.map((r, i) => r.status !== "pass" ? i : -1).filter(i => i >= 0);
    if (idxs.length) runPool(idxs);
  };
  function alertBox(msg) { const pt = $("ptext"); pt.style.display = "block"; pt.textContent = msg; }

  function render() {
    const counts = { all: results.length };
    ORDER.concat("pending").forEach(s => counts[s] = 0);
    results.forEach(r => counts[r.status]++);
    $("legend").innerHTML = ["all", ...ORDER].map(s =>
      `<button class="chip ${filter === s ? "on" : ""}" data-f="${s}">
         <span class="badge s-${s === "all" ? "pending" : s}">${esc(t(s))}</span>
         <div class="n">${counts[s]}</div><div class="d">${esc(t(s + "D"))}</div></button>`).join("");
    $("legend").querySelectorAll(".chip").forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });

    const rows = entries.map((e, i) => [e, results[i], i])
      .filter(([, r]) => filter === "all" || r.status === filter)
      .sort((a, b) => filter !== "all" ? a[2] - b[2] : (rank(a[1]) - rank(b[1])) || (a[2] - b[2]));
    $("tbody").innerHTML = rows.length ? rows.map(([e, r]) => row(e, r)).join("") :
      `<tr><td colspan="4" class="empty">${esc(t("emptyFilter"))}</td></tr>`;
  }
  const rank = r => { const k = ORDER.indexOf(r.status); return k < 0 ? 99 : k; };

  function row(e, r) {
    const fld = r.fields || {};
    const authorsShort = e.authors.slice(0, 3).join(", ") + (e.authors.length > 3 ? " et al." : "");
    const scholar = `https://scholar.google.com/scholar?q=${encodeURIComponent(e.title || e.key)}`;
    let match = `<span class="meta">${r.status === "pending" ? "" : esc(t("none"))}</span>`;
    if (r.match) {
      const m = r.match;
      const au = m.authors.slice(0, 3).join(", ") + (m.authors.length > 3 ? " et al." : "");
      match = `<div class="src">${esc(m.source)}${m.viaDOI ? " · " + esc(t("viaDOI")) : ""}</div>
        <div class="t">${m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a>` : esc(m.title)}</div>
        <div class="meta"><span class="${fld.author ? "bad" : ""}">${esc(au)}</span></div>
        <div class="meta"><span class="${fld.year ? "bad" : ""}">${esc(m.year)}</span>${m.venue ? ` · <span class="${fld.venue ? "bad" : ""}">${esc(m.venue)}</span>` : ""}</div>`;
    }
    const notes = r.reasons.map(([k, x]) => `<div>${esc(t(k, x))}</div>`).join("");
    return `<tr>
      <td><div class="key">${esc(e.key)}</div><div class="t">${esc(e.title || "?")}</div>
        <div class="meta"><span class="${fld.author ? "bad" : ""}">${esc(authorsShort)}</span></div>
        <div class="meta"><span class="${fld.year ? "bad" : ""}">${esc(e.year)}</span>${e.venue ? ` · <span class="${fld.venue ? "bad" : ""}">${esc(e.venue)}</span>` : ""}</div></td>
      <td><span class="badge s-${r.status}">${esc(t(r.status))}</span></td>
      <td>${match}</td>
      <td class="notes">${notes}<a class="scholar" href="${scholar}" target="_blank" rel="noopener">${esc(t("scholar"))} ↗</a></td>
    </tr>`;
  }

  $("export").onclick = () => {
    const head = ["key", "status", "title", "authors", "year", "notes", "db_source", "db_title", "db_authors", "db_year", "db_venue", "db_link"];
    const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const lines = [head.join(",")].concat(entries.map((e, i) => {
      const r = results[i], m = r.match || {};
      return [e.key, t(r.status), e.title, e.authors.join("; "), e.year,
        r.reasons.map(([k, x]) => t(k, x)).join(" "),
        m.source, m.title, (m.authors || []).join("; "), m.year, m.venue, m.url].map(q).join(",");
    }));
    const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "refcheck_report.csv"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };

  applyLang();
})();
</script>
</body>
</html>
